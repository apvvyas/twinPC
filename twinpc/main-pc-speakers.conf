# Output that plays through the main PC's speakers. 127.0.0.1:4713 is forwarded over SSH by the
# main PC's twin-audio.service; switch with `twin audio on|off` on the main PC.
context.modules = [
  { name = libpipewire-module-pulse-tunnel
    args = {
      tunnel.mode           = sink
      pulse.server.address  = "tcp:127.0.0.1:4713"
      reconnect.interval.ms = 5000
      node.name             = "main-pc-speakers"
      node.description      = "Main PC speakers"
      audio.rate            = 48000
      audio.channels        = 2
      audio.position        = [ FL FR ]
    }
  }
]
